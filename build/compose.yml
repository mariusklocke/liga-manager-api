services:
  php:
    image: mklocke/liga-manager-api:${APP_TAG}
    pull_policy: never
    environment:
      - APP_BASE_URL=http://app.internal
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=123456
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_URL=${DB_DRIVER}://test@database/test
      - EMAIL_SENDER_ADDRESS=noreply@example.com
      - EMAIL_SENDER_NAME=phpunit
      - EMAIL_URL=smtps://test:9ecd4875@mailpit:1025?verify_peer=0
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - LOG_LEVEL=info
      - REDIS_HOST=redis
    tmpfs:
      - /var/www/logos:mode=777
    volumes:
      - ${PWD}/tests:/var/www/api/tests
      - ${PWD}/vendor:/var/www/api/vendor
    secrets:
      - source: db-password
        target: db-password
      - source: jwt-secret
        target: jwt-secret
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "docker-php-healthcheck" ]
      start_period: 1m
      start_interval: 5s
      interval: 1m
      timeout: 5s
  redis:
    image: redis:${REDIS_VERSION}-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "PING" ]
      start_period: 1m
      start_interval: 5s
      interval: 1m
      timeout: 5s
  mailpit:
    image: axllent/mailpit:latest
    environment:
      - MP_SMTP_TLS_CERT=sans:localhost
      - MP_SMTP_TLS_KEY=sans:localhost
      - MP_SMTP_REQUIRE_TLS=true
      - MP_SMTP_AUTH=test:9ecd4875
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8025" ]
      start_period: 1m
      start_interval: 5s
      interval: 1m
      timeout: 5s
secrets:
  db-password:
    environment: DB_PASSWORD
  db-root-password:
    environment: DB_ROOT_PASSWORD
  jwt-secret:
    environment: JWT_SECRET
