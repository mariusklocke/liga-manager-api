name: Continuous Integration
on: [push]
env:
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
jobs:
  build-docs:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build docs
        run: make docs
      - name: Upload docs as pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  build-image:
    runs-on: ubuntu-latest
    env:
      APP_RUNTIME: ${{ matrix.runtime }}
      DB_DRIVER: ${{ matrix.dbms == 'mariadb' && 'pdo-mysql' || 'pdo-pgsql'}}
      PHP_VERSION: ${{ matrix.php-version }}
    strategy:
      matrix:
        php-version: ["8.4", "8.5"]
        runtime: ["fpm", "roadrunner"]
        dbms: ["mariadb", "postgres"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build image
        run: make build
      - name: Test image
        run: make test
      - name: Create tarball
        run: make tarball
        if: matrix.php-version == '8.5' && matrix.dbms == 'mariadb' && matrix.runtime == 'roadrunner'
      - name: Publish image
        run: make publish
        if: (github.ref_type == 'tag' || github.ref_name == 'master') && matrix.php-version == '8.5' && matrix.dbms == 'mariadb'
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage.xml
          path: build/artifacts/coverage.xml
        if: matrix.php-version == '8.5' && matrix.dbms == 'mariadb' && matrix.runtime == 'roadrunner'
      - name: Upload tarball
        uses: actions/upload-artifact@v6
        with:
          name: tarball
          path: build/liga-manager-api.tar.gz
        if: matrix.php-version == '8.5' && matrix.dbms == 'mariadb' && matrix.runtime == 'roadrunner'
  deploy-docs:
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    needs: build-docs
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Deploy pages from artifact
        uses: actions/deploy-pages@v5
  upload-coverage:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    needs:
      - build-image
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/artifacts
      - name: List artifacts
        run: ls -R build/artifacts
      - name: Upload report to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: build/artifacts/coverage.xml
