error_reporting=E_ALL
display_errors=Off
log_errors=On
expose_php=Off
short_open_tag=Off
xdebug.mode=coverage
upload_max_filesize=2M
post_max_size=64M
apc.enable_cli=1
date.timezone=Europe/Berlin

; Extension group 00
extension=bcmath
extension=gd
extension=gmp
extension=intl
extension=pcntl
extension=sockets

; Extension group 01
extension=pdo_pgsql

; Extension group 02
extension=pdo_mysql

; PECL extensions
extension=apcu
extension=redis
